name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    outputs:
      version:
        description: The mod version from modinfo.json.
        value: ${{ jobs.build.outputs.version }}
      zip-name:
        description: The mod zip's file name, bettermods_<version>.zip.
        value: ${{ jobs.build.outputs.zip-name }}
      artifact-name:
        description: The name of the workflow artifact holding the zip.
        value: ${{ jobs.build.outputs.artifact-name }}

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    outputs:
      version: ${{ steps.package.outputs.version }}
      zip-name: ${{ steps.package.outputs.zip-name }}
      artifact-name: ${{ steps.package.outputs.artifact-name }}
    steps:
      - name: Check out
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # Downloads the game assemblies for modinfo.json's dependencies.game from the official CDN
      # (cached) and exports VINTAGE_STORY, which the csproj's HintPaths use.
      - name: Set up Vintage Story assemblies
        uses: ./.github/actions/setup-vintagestory

      - name: Build
        run: dotnet build BetterMods.sln -c Release

      - name: Package
        id: package
        run: bash .github/scripts/package.sh bin/Release/Mods/bettermods dist

      - name: Upload the mod zip
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.artifact-name }}
          path: ${{ steps.package.outputs.zip-path }}
          if-no-files-found: error
